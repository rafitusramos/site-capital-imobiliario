# Qualidade
#
# Roda em PRs e pushes para `Preview` e `main`: typecheck, lint e testes
# unitários (Vitest), mais um job separado de `npm audit`.
#
# Por que NÃO há `next build` aqui: o deploy de preview da Vercel já builda todo
# PR e publica o resultado como check. Um build no CI precisaria das variáveis do
# Supabase e, como preview e produção usam o MESMO banco, leria o banco de
# produção em tempo de build. Duplicaria a Vercel sem ganho.
#
# Sem secrets neste workflow. Actions fixadas por SHA (o comentário traz a versão).
name: Qualidade

on:
  pull_request:
    branches: [Preview, main]
  push:
    branches: [Preview, main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

  auditoria:
    name: qualidade-auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Só dependências de produção; bloqueia em severidade alta ou crítica,
      # exceto as exceções listadas (com caminho e condição de saída) em
      # .github/scripts/auditoria-dependencias.mjs. Hoje: o postcss embutido no
      # next 15.5.x, que só o Next 16 troca.
      - name: npm audit
        run: node .github/scripts/auditoria-dependencias.mjs
