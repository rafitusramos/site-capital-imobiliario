# Migrations do Supabase
#
# O que faz:
#   - Pull request para `Preview`: `supabase db push --dry-run` (só lista o que
#     seria aplicado; não escreve nada no banco).
#   - Push (merge) em `Preview`, ou execução manual: `supabase db push` de verdade.
#
# ATENÇÃO: Preview e produção compartilham UM único banco Supabase. Mergear em
# `Preview` aplica a migration em PRODUÇÃO.
#
# Secret obrigatório: SUPABASE_DB_URL — connection string do Session pooler
# (Project Settings > Database), com a senha codificada para URL (URL-encoded).
#
# Pré-requisito: a tabela `supabase_migrations.schema_migrations` precisa listar
# a versão de TODO arquivo já aplicado em `supabase/migrations/`. Se faltar uma,
# o push tenta rodar o arquivo de novo.
name: Migrations Supabase

on:
  pull_request:
    branches: [Preview]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-supabase.yml'
  push:
    branches: [Preview]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Conferir secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL vazio ou ausente. Configure em Settings > Secrets and variables > Actions (Session pooler, senha URL-encoded)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Dry-run (pull request)
        if: github.event_name == 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Aplicar migrations (push / manual)
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
